<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Login e Carica RaceResult</title>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <label>Username: <input type="text" name="username" required /></label><br />
    <label>Password: <input type="password" name="password" required /></label><br />
    <button type="submit">Login</button>
  </form>

  <h2>Carica dati RaceResult</h2>
  <form id="raceResultForm" style="display:none;">
    <label>Track Name: <input type="text" name="track_name" required /></label><br />
    <label>Mission Name: <input type="text" name="mission_name" required /></label><br />
    <label>Number of Laps Completed: <input type="number" name="number_of_laps_completed" required /></label><br />
    <label>Number of Evaluated Cones Yellow: <input type="number" name="number_of_evaluated_cones_yellow" required /></label><br />
    <label>Number of Evaluated Cones Blue: <input type="number" name="number_of_evaluated_cones_blue" required /></label><br />
    <label>Is Successful: 
      <select name="is_successful" required>
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </label><br />
    <label>Rosbag File:
    <input type="file" name="zip_file" />
    <input type="file" name="yaml_file" />
    <input type="file" name="db_file" />
    </label><br />
    <label>Avg Lap Time: <input type="number" step="0.01" name="avg_lap_time" required /></label><br />
    <label>Timestamp: <input type="datetime-local" name="timestamp" /></label><br />
    <button type="submit">Invia RaceResult</button>
  </form>
    <h2>Test Rosbags API</h2>
  <button id="btn-list-rosbags">Show List</button>
  <br/><br/>
  <label for="rosbag-id">Rosbag ID:</label>
  <input type="number" id="rosbag-id" min="1" style="width:4em"/>
  <button id="btn-detail-rosbag">Show Details</button>
  <button id="btn-delete-rosbag">Cancella</button>
  <!-- <button id="btn-update-rosbag">Aggiorna</button> -->
  <pre id="response" style="background:#f0f0f0; padding:1em;"></pre>

  <script>
    let authToken = null;
    const loginForm = document.getElementById('loginForm');
    const raceResultForm = document.getElementById('raceResultForm');
    const responsePre = document.getElementById('response');

    // Gestione login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      responsePre.textContent = 'Login in corso...';

      const data = {
        username: loginForm.username.value,
        password: loginForm.password.value
      };

      try {
        const res = await fetch('http://127.0.0.1:8000/api-token-auth/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });

        const json = await res.json();

        if (!res.ok) {
          responsePre.textContent = 'Errore login: ' + JSON.stringify(json, null, 2);
        } else {
          authToken = json.token;
          responsePre.textContent = 'Login riuscito! Token ottenuto.';
          loginForm.style.display = 'none';
          raceResultForm.style.display = 'block';
        }
      } catch (err) {
        responsePre.textContent = 'Errore di rete: ' + err;
      }
    });

    // Gestione invio dati RaceResult
    raceResultForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!authToken) {
    responsePre.textContent = 'Errore: devi effettuare il login prima.';
    return;
  }

  const formData = new FormData(raceResultForm);

  // Converti timestamp in formato ISO
  const timestampRaw = raceResultForm.timestamp.value;
  formData.set('timestamp', new Date(timestampRaw).toISOString());


  try {

    const res = await fetch('http://127.0.0.1:8000/api/rosbags/', {
    // const res = await fetch(`http://127.0.0.1:8000/api/rosbags/${id}/update/`, {
      method: 'POST',
      headers: {
        'Authorization': 'Token ' + authToken
        // NON mettere 'Content-Type': fetch lo imposta automaticamente con boundary
      },
      body: formData
    });

    const json = await res.json();

    if (!res.ok) {
      responsePre.textContent = 'Errore invio dati: ' + JSON.stringify(json, null, 2);
      return;
    }

    // Recupera lista aggiornata
    const listRes = await fetch('http://127.0.0.1:8000/api/rosbags/?page=1', {
      headers: {
        'Authorization': 'Token ' + authToken
      }
    });

    const listJson = await listRes.json();
    responsePre.textContent = 'Lista aggiornata:\n' + JSON.stringify(listJson, null, 2);
    raceResultForm.reset();
    

  } catch (err) {
    responsePre.textContent = 'Errore di rete: ' + err;
  }
  });

  const BASE_URL_RB = 'http://127.0.0.1:8000/api/rosbags/';

async function listRosbags() {
  try {
    const res = await fetch(BASE_URL_RB + '?page=1', {
      headers: { 'Authorization': 'Token ' + authToken }
    });
    const bodyText = await res.text();

    if (!res.ok) {
      // Errore HTTP (404/500 etc): mostro tutto il corpo della risposta
      responsePre.textContent = `Errore ${res.status}:\n${bodyText}`;
      return;
    }

    // Provo il parse JSON
    let jsonData;
    try {
      jsonData = JSON.parse(bodyText);
    } catch (parseErr) {
      responsePre.textContent = 'Risposta non JSON (lista):\n' + bodyText;
      return;
    }

    // JSON valido: lo stampo formattato
    responsePre.textContent = 'Lista rosbags:\n' + JSON.stringify(jsonData, null, 2);

  } catch (networkErr) {
    responsePre.textContent = 'Errore di rete:\n' + networkErr;
  }
}

async function getRosbagDetail(id) {
  try {
    const res = await fetch(`${BASE_URL_RB}${id}/detail`, {
      headers: { 'Authorization': 'Token ' + authToken }
    });

    if (!res.ok) {
      const bodyText = await res.text();
      responsePre.textContent = `Errore ${res.status}:\n${bodyText}`;
      return;
    }

    // Prendi nome file dalla Content-Disposition, se presente
    const contentDisposition = res.headers.get('Content-Disposition');
    const filenameMatch = contentDisposition?.match(/filename="?([^"]+)"?/);
    const filename = filenameMatch?.[1] || `rosbag_${id}.bag`;

    // Ottieni il contenuto come Blob
    const blob = await res.blob();

    // Crea link per scaricare il file
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);

    responsePre.textContent = `File rosbag ${filename} scaricato con successo.`;

  } catch (err) {
    responsePre.textContent = 'Errore di rete:\n' + err;
  }
}

async function deleteRosbag(id) {
  try {
    const res = await fetch(`${BASE_URL_RB}${id}/`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Token ' + authToken }
    });

    if (!res.ok) {
      const bodyText = await res.text();
      responsePre.textContent = `Errore ${res.status}:\n${bodyText}`;
      return;
    }

    responsePre.textContent = `File rosbag con id: ${id}, eliminato con successo.`;

  } catch (err) {
    responsePre.textContent = 'Errore di rete:\n' + err;
  }
}

// Listener sui bottoni
document.getElementById('btn-list-rosbags').addEventListener('click', () => {
  if (!authToken) {
    responsePre.textContent = 'Effettua il login prima';
    return;
  }
  listRosbags();
});

document.getElementById('btn-detail-rosbag').addEventListener('click', () => {
  if (!authToken) {
    responsePre.textContent = 'Effettua il login prima';
    return;
  }
  const id = parseInt(document.getElementById('rosbag-id').value, 10);
  if (!id) {
    responsePre.textContent = 'Inserisci un ID valido';
    return;
  }
  getRosbagDetail(id);
});


document.getElementById('btn-delete-rosbag').addEventListener('click', () => {
  if (!authToken) {
    responsePre.textContent = 'Effettua il login prima';
    return;
  }
  const id = parseInt(document.getElementById('rosbag-id').value, 10);
  if (!id) {
    responsePre.textContent = 'Inserisci un ID valido';
    return;
  }
  deleteRosbag(id);
});
