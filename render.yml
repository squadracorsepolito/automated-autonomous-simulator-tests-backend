services:
  - type: web
    name: scd-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python create_admin.py
    startCommand: gunicorn automated_tests_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scd-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "True"

databases:
  - name: scd-db
    plan: free